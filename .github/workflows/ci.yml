name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Builds shared first, so a clean-clone build failure shows up here
      # rather than on someone's machine.
      - run: npm run build

      - run: npm test

      - run: npm run typecheck

      # The Car Thing's browser is Chromium 69 era, where anything newer in the
      # bundle is a blank screen rather than a degraded one.
      - run: npm run check:device

  build-macos:
    # The macOS-only plugins are skipped on Linux, so at least compile and run
    # the suite on the platform they are written for.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
